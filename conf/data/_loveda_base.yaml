# Shared by every LoveDA data config (not selectable on its own: it has no `classes`).
# layout: <root>/<split>/images/*.png  and  <root>/<split>/masks/*.png (same file names)
# Masks hold the original LoveDA class ids: 0 no-data, 1 background, 2 building, 3 road, 4 water,
# 5 barren, 6 forest, 7 agriculture.   Make them with: python -m src.prepare_data (default mode `labels`).
root: ./data/loveda_multi
clearml_dataset_id: null  # if set, root is replaced by Dataset.get(...).get_local_copy()
in_channels: 3
divide_by: 255.0          # same input scaling as the Chisel server (RGB / 255, no mean/std)
mean: null
std: null
splits: {train: train, val: val}
