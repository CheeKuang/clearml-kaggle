enabled: true
mode: gate                # gate = fail the run on violation | diagnostic = log only
cpu_request: 4            # guaranteed vCPUs of the inference pod
cpu_limit: 8              # max vCPUs of the inference pod
memory_limit_gib: 8       # inference pod memory limit
tile_size: 1024           # H = W of one inference tile
batch_size: 1             # tiles per request
warmup: 2
iters: 10
max_latency_s: null       # p95 per request at cpu_limit threads (null = report only)
