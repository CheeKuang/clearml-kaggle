# Hydra is the single config authority. Compose at the CLI, e.g.
#   python -m src.train architecture=fpn encoder=resnet50_torchgeo_s2 loss.dice_weight=0.7
defaults:
  - architecture: unet
  - encoder: resnet34_imagenet
  - loss: default
  - data: buildings
  - preflight: default
  - resource: default
  - _self_

seed: 42

# shared by every architecture (arch/encoder groups add the rest of the `model` block)
model:
  in_channels: ${data.in_channels}
  classes: 1

train:
  epochs: 30
  batch_size: 8
  num_workers: 4
  amp: true
  patience: 8

optimizer:
  name: AdamW
  lr: 3.0e-4
  weight_decay: 1.0e-4

sweep:                        # post-training, on the best checkpoint
  enabled: true
  split: val                  # use a held-out split (e.g. test) to avoid picking on the tuning set
  tta: [none, flip, d4]       # none | flip (4) | d4 (8)
  thresholds: {start: 0.30, stop: 0.70, step: 0.05}
  metric: iou                 # iou | f1

finalize:
  metadata_file: metadata.json
  publish_on_completion: true # Task -> Published (read-only) after completion

clearml:
  enabled: true
  project: building-segmentation
  task_name: ${model.arch}-${model.encoder_name}
  tags: [hydra, smp]
  output_uri: true            # true = ClearML files server; or s3://..., gs://...
  # remote execution (Task.execute_remotely) -> queue served by a clearml-agent (e.g. on Kaggle)
  execute_remotely: false
  queue: kaggle
  clone_on_remote: false
  # Keys exposed through Task.connect -> editable in the UI and addressable by HPO as "Overrides/<key>".
  # Group names (architecture, encoder) are allowed: the config is recomposed with Hydra.
  tunable:
    - architecture
    - encoder
    - optimizer.lr
    - optimizer.weight_decay
    - loss.dice_weight
    - loss.bce_weight
    - train.batch_size
    - train.epochs
    - data.root
    - data.clearml_dataset_id
    - preflight.enabled
    - preflight.domain_shift.mode
    - preflight.label_balance.mode
