# Hydra is the single config authority. Compose at the CLI, e.g.
#   python -m src.training.train data=road architecture=fpn loss.dice_weight=0.7
defaults:
  - architecture: unet
  - encoder: resnet34_imagenet
  - loss: default
  - data: loveda            # building | road | water | vegetation = one class (production); loveda = all four
  - preflight: default
  - serve: default
  - _self_

seed: 42

# shared by every architecture (arch/encoder groups add the rest of the `model` block)
model:
  in_channels: ${data.in_channels}
  classes: ${len:${data.classes}}   # one output channel per entry of data.classes (1 if none)

train:
  epochs: 30
  batch_size: 8
  num_workers: 4
  amp: true
  patience: 8

optimizer:
  name: AdamW
  lr: 3.0e-4
  weight_decay: 1.0e-4

sweep:                        # post-training, on the best checkpoint
  enabled: true
  split: val                  # use a held-out split (e.g. test) to avoid picking on the tuning set
  tta: [none, flip, d4]       # none | flip (4) | d4 (8)
  thresholds: {start: 0.30, stop: 0.70, step: 0.05}
  metric: iou                 # iou | f1

export:
  onnx:
    enabled: true             # after training: <class>.onnx + .onnx.json for the Chisel server (src/export_onnx.py)
    size: 1280                # the server's input size

finalize:
  metadata_file: metadata.json
  publish_on_completion: true # Task -> Published (read-only) after completion

clearml:                      # everything under here is about ClearML, not about the model
  enabled: true               # false = run fully offline, no Task is created
  project: building-segmentation
  task_name: ${model.arch}-${model.encoder_name}
  tags: [hydra, smp]
  output_uri: true            # true = ClearML files server; or s3://..., gs://...
  # remote execution (Task.execute_remotely) -> queue served by a clearml-agent (e.g. on Kaggle)
  execute_remotely: false
  queue: kaggle
  clone_on_remote: false
  # TO MAKE A SETTING EDITABLE from the ClearML UI, HPO or a pipeline, add its key here ("Overrides/<key>").
  # Only these keys are applied remotely. Config groups (architecture, encoder, data) switch whole YAML files.
  tunable:
    - architecture
    - encoder
    - loss                    # config group: loss/<class>.yaml (weights per class), default = 0.5 BCE + 0.5 Dice
    - data                    # config group: which class / dataset config (building, road, water, vegetation, loveda)
    - optimizer.lr
    - optimizer.weight_decay
    - loss.dice_weight
    - loss.bce_weight
    - train.batch_size
    - train.epochs
    - data.root
    - data.clearml_dataset_id
    - preflight.enabled
    - preflight.domain_shift.mode
    - preflight.label_balance.mode
    - serve.source
    - serve.spec
    - serve.memory_limit_gib
    - serve.max_request_s
    - serve.tiles
