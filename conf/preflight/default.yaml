enabled: true
reference_split: train
candidate_split: val
max_samples: 500          # per split, random subset
seed: ${seed}

domain_shift:             # k-NN interleaving
  enabled: true
  mode: gate              # gate = fail the run on violation | diagnostic = log only
  feature: stats          # stats = per-channel mean/std/p5/p95 | encoder = pooled encoder features
  k: 10
  max_shift: 0.5          # 0 = perfectly interleaved, 1 = fully separated

label_balance:            # positive-pixel share per tile and class + Wasserstein distance
  enabled: true
  mode: diagnostic
  max_wasserstein: 0.05
  max_ratio_gap: 0.5      # relative gap between the mean shares (null disables)
